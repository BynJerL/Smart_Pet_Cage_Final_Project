<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Control Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    padding: 20px;
  }
  .card {
    background: #1e293b;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  button {
    margin: 4px;
    padding: 10px 14px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }

  .on { color: #22c55e; }
  .off { color: #ef4444; }
  .small { font-size: 0.9em; color: #94a3b8; }
</style>
</head>

<body>

<h1>Smart Pet Cage Dashboard</h1>

<div class="card">
  <h2>Send Command</h2>
  <button onclick="sendCommand('gate','toggle')">Toggle Gate</button>
  <button onclick="sendCommand('pump','enable')">Pump ON</button>
  <button onclick="sendCommand('pump','disable')">Pump OFF</button>
  <button onclick="sendCommand('fan','enable')">Fan ON</button>
  <button onclick="sendCommand('fan','disable')">Fan OFF</button>
</div>

<div class="card">
  <h2>Schedule</h2>

  <h3>Feeder</h3>
  <div id="feeder-schedule"></div>

  <h3>Water</h3>
  <div id="water-schedule"></div>

  <button onclick="updateSchedule()">Update Schedule</button>
  <div class="small" id="schedule_msg"></div>
</div>

<div class="card">
  <h2>Threshold</h2>
  <div>Water Level Low: <input type="number" id="water_level_low" value="20"> %</div>
  <div>Water Level High: <input type="number" id="water_level_high" value="80"> %</div>
  <div>Temperature Low: <input type="number" id="temp_low" value="20"> °C</div>
  <div>Temperature High: <input type="number" id="temp_high" value="30"> °C</div>
  <div>Humidity Low: <input type="number" id="hum_low" value="40"> %</div>
  <div>Humidity High: <input type="number" id="hum_high" value="80"> %</div>
  <button onclick="updateThreshold()">Update Threshold</button>
  <div class="small" id="threshold_msg"></div>
</div>

<div class="card">
  <h2>Status</h2>
  <div>Gate: <span id="gate">---</span></div>
  <div>Pump: <span id="pump">---</span></div>
  <div>Fan: <span id="fan">---</span></div>
  <div class="small">Last Action: <span id="last_action">---</span></div>
  <div class="small">Timestamp: <span id="ts">---</span></div>
</div>

<script>
let FIREBASE_URL = "";
let POLL_INTERVAL = 2000;

/* =============================
   LOAD CONFIG
============================= */
fetch("config.json")
  .then(res => res.json())
  .then(cfg => {
    FIREBASE_URL = cfg.firebase_url;
    POLL_INTERVAL = cfg.poll_interval_ms || 2000;
    startStatusPolling();
    loadThreshold();
  })
  .catch(err => {
    alert("Failed to load config.json");
    console.error(err);
  });

/* =============================
   SEND COMMAND (QUEUE)
============================= */
function sendCommand(target, action) {
  fetch(`${FIREBASE_URL}/commands.json`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ 
      target, 
      action,
      ts: Math.floor(Date.now() / 1000)
    })
  })
  .then(res => res.json())
  .then(data => {
    console.log("Command queued:", data.name);
  })
  .catch(err => console.error("Command failed:", err));
}

/* =============================
   POLL STATUS
============================= */
function startStatusPolling() {
  setInterval(fetchStatus, POLL_INTERVAL);
  fetchStatus();
}

function fetchStatus() {
  fetch(`${FIREBASE_URL}/status.json`)
    .then(res => res.json())
    .then(updateStatus)
    .catch(err => console.error("Status fetch failed:", err));
}

function updateStatus(data) {
  if (!data) return;

  setBool("gate", data.gate);
  setBool("pump", data.pump);
  setBool("fan", data.fan);

  document.getElementById("last_action").textContent = data.last_action || "-";
  document.getElementById("ts").textContent =
    data.ts ? formatGMT7(data.ts) : "-";
}

function setBool(id, val) {
  const el = document.getElementById(id);
  if (val === true) {
    el.textContent = "ON";
    el.className = "on";
  } else if (val === false) {
    el.textContent = "OFF";
    el.className = "off";
  } else {
    el.textContent = "---";
    el.className = "";
  }
}

function formatGMT7(unixSeconds) {
  if (!unixSeconds) return "-";
  const date = new Date((unixSeconds + 7 * 3600) * 1000);
  return date.toLocaleString("id-ID", { timeZone: "Asia/Jakarta" });
}

function buildScheduleUI(type) {
  const container = document.getElementById(`${type}-schedule`);
  container.innerHTML = "";

  for (let i = 1; i <= 4; i++) {
    const row = document.createElement("div");
    row.style.marginBottom = "6px";

    row.innerHTML = `
      Slot ${i}:
      <input type="time" id="${type}_time_${i}">
      <label>
        <input type="checkbox" id="${type}_en_${i}"> Enabled
      </label>
    `;

    container.appendChild(row);
  }
}

function collectSchedule(type) {
  const result = {};

  for (let i = 1; i <= 4; i++) {
    const time = document.getElementById(`${type}_time_${i}`).value;
    const enabled = document.getElementById(`${type}_en_${i}`).checked;

    if (enabled && !time) {
      throw `${type.toUpperCase()} slot ${i} enabled but no time set`;
    }

    result[i] = {
      time: `${enabled}` ? `${time}` : null,
      enabled: `${enabled}`
    };
  }

  return result;
}

function updateSchedule() {
  const msg = document.getElementById("schedule_msg");
  msg.textContent = "";

  let schedules;

  try {
    schedules = {
      feeder: collectSchedule("feeder"),
      water: collectSchedule("water")
    };
  } catch (err) {
    msg.textContent = err;
    msg.style.color = "#ef4444";
    return;
  }

  // 1️⃣ PUT schedules (source of truth)
  fetch(`${FIREBASE_URL}/schedules.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(schedules)
  })
  .then(res => {
    if (!res.ok) throw "Failed to save schedule";
    // 2️⃣ POST reload command
    return fetch(`${FIREBASE_URL}/commands.json`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        target: "schedule",
        action: "reload"
      })
    });
  })
  .then(() => {
    msg.textContent = "Schedule updated successfully";
    msg.style.color = "#22c55e";
  })
  .catch(err => {
    msg.textContent = err;
    msg.style.color = "#ef4444";
  });
}

function loadSchedule() {
  fetch(`${FIREBASE_URL}/schedules.json`)
    .then(res => res.json())
    .then(data => {
      if (!data) return;

      ["feeder", "water"].forEach(type => {
        if (!data[type]) return;

        for (let i = 1; i <= 4; i++) {
          const slot = data[type][i];
          if (!slot) continue;

          document.getElementById(`${type}_time_${i}`).value = slot.time || "";
          document.getElementById(`${type}_en_${i}`).checked = !!slot.enabled;
        }
      });
    });
}

function loadThreshold() {
  fetch(`${FIREBASE_URL}/threshold.json`)
    .then(res => res.json())
    .then(data => {
      if (!data) return;

      document.getElementById("water_level_low").value = data.water_level?.low ?? 20;
      document.getElementById("water_level_high").value = data.water_level?.high ?? 80;

      document.getElementById("temp_low").value = data.temperature?.low ?? 20;
      document.getElementById("temp_high").value = data.temperature?.high ?? 30;

      document.getElementById("hum_low").value = data.humidity?.low ?? 40;
      document.getElementById("hum_high").value = data.humidity?.high ?? 80;
    })
    .catch(err => console.error("Threshold load failed:", err));
}

function collectThreshold() {
  const t = {
    water_level: {
      low: Number(document.getElementById("water_level_low").value),
      high: Number(document.getElementById("water_level_high").value)
    },
    temperature: {
      low: Number(document.getElementById("temp_low").value),
      high: Number(document.getElementById("temp_high").value)
    },
    humidity: {
      low: Number(document.getElementById("hum_low").value),
      high: Number(document.getElementById("hum_high").value)
    },
    updated_at: Math.floor(Date.now() / 1000)
  };

  // Simple sanity checks
  if (t.water_level.low >= t.water_level.high)
    throw "Water level LOW must be less than HIGH";

  if (t.temperature.low >= t.temperature.high)
    throw "Temperature LOW must be less than HIGH";

  if (t.humidity.low >= t.humidity.high)
    throw "Humidity LOW must be less than HIGH";

  return t;
}

function updateThreshold() {
  const msg = document.getElementById("threshold_msg");
  msg.textContent = "";

  let threshold;

  try {
    threshold = collectThreshold();
  } catch (err) {
    msg.textContent = err;
    msg.style.color = "#ef4444";
    return;
  }

  fetch(`${FIREBASE_URL}/threshold.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(threshold)
  })
  .then(res => {
    if (!res.ok) throw "Failed to save threshold";
    msg.textContent = "Threshold updated successfully";
    msg.style.color = "#22c55e";
  })
  .catch(err => {
    msg.textContent = err;
    msg.style.color = "#ef4444";
  });
}


buildScheduleUI("feeder");
buildScheduleUI("water");

setTimeout(() => {
  loadSchedule();
}, 500);

</script>

</body>
</html>
